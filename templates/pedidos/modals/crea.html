<!-- MODAL: CREAR PEDIDO -->
<div class="modal fade" id="modalCrearPedido" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-plus"></i> Crear Nuevo Pedido
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="formCrearPedido" method="post" action="{% url 'crear_pedido' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6 class="text-muted mb-3">
                                <i class="fas fa-store"></i> Datos del Pedido
                            </h6>

                            <div class="form-group">
                                <label class="form-label">Tienda Solicitante</label>
                                <input type="text" class="form-control" value="{{ perfil.nombre_ubicacion|default:'Mi tienda' }}" disabled>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Almacén Proveedor</label>
                                <input type="text" class="form-control" value="{{ proveedor.nombre_ubicacion|default:'Almacén' }}" disabled>
                            </div>

                            <div class="form-group">
                                <label for="comentarioPedido" class="form-label">Comentario</label>
                                <textarea
                                    class="form-control"
                                    id="comentarioPedido"
                                    name="comentario"
                                    rows="4"
                                    placeholder="Observaciones del pedido (opcional)"
                                ></textarea>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <h6 class="text-muted mb-3">
                                <i class="fas fa-box"></i> Agregar Productos
                            </h6>

                            <div class="form-group">
                                <label for="buscarProductoPedido" class="form-label">Buscar producto</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white border-right-0"><i class="fas fa-search"></i></span>
                                    </div>
                                    <input
                                        type="text"
                                        class="form-control border-left-0"
                                        id="buscarProductoPedido"
                                        placeholder="Buscar por código o nombre..."
                                        autocomplete="off"
                                    >
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Productos disponibles</label>
                                <div id="listaProductosPedido" class="border rounded p-2" style="max-height: 320px; overflow-y: auto; background: #fff;">
                                    <div class="text-center p-4 text-muted">
                                        <i class="fas fa-box-open fa-2x mb-2"></i>
                                        <p>Escriba código o nombre para buscar productos</p>
                                    </div>
                                </div>
                                <select id="pedidoProductoSelect" hidden>
                                    {% for item in productos_disponibles %}
                                    <option
                                        value="{{ item.producto.id }}"
                                        data-codigo="{{ item.producto.codigo }}"
                                        data-nombre="{{ item.producto.nombre }}"
                                        data-stock="{{ item.stock }}"
                                        data-unidades="{{ item.producto.unidades_por_caja }}"
                                    ></option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered mb-0" id="tablaItemsPedido">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Stock</th>
                                    <th>Cantidad</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr id="filaVaciaPedido">
                                    <td colspan="5" class="text-center text-muted">Aún no agregaste productos</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Pedido
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
