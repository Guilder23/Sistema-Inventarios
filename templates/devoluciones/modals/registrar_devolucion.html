<!-- Modal Registrar Devolución -->
<div class="modal fade" id="modalRegistrarDevolucion" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form id="formRegistrarDevolucion" method="post" enctype="multipart/form-data" action="{% url 'devoluciones:registrar' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-undo text-primary"></i> Registrar Devolución</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group col-md-8">
                            <label>Producto <span class="text-danger">*</span></label>
                            <div class="position-relative">
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                                    </div>
                                    <input type="text" class="form-control" id="buscarProductoDevolucion" placeholder="Buscar producto por nombre o código..." autocomplete="off">
                                </div>
                                <div id="resultadosProductoDevolucion" class="list-group position-absolute w-100 shadow" style="z-index:1060; display:none; max-height:180px; overflow-y:auto;"></div>
                            </div>
                            <div id="productoSeleccionadoDevolucion" class="small text-muted mt-2">Ningún producto seleccionado.</div>
                            <select class="d-none" id="productoDevolucionSelect" name="producto" required>
                                <option value="">Seleccione un producto...</option>
                                {% for producto in productos %}
                                <option value="{{ producto.id }}">{{ producto.codigo }} - {{ producto.nombre }} (Stock: {{ producto.stock_disponible }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label>Unidades Devueltas <span class="text-danger">*</span></label>
                            <input type="number" id="cantidadDevolucion" class="form-control" name="cantidad" min="1" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Comentario</label>
                        <textarea id="comentarioDevolucion" class="form-control" name="comentario" rows="3" placeholder="Motivo de devolución o comentario..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnGuardarDevolucion" class="btn btn-primary">Registrar Devolución</button>
                </div>
            </form>
        </div>
    </div>
</div>
